<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도비중학교 공식 사이트</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
        }
        header img {
            height: 50px;
            margin-right: 15px;
        }
        nav {
            background-color: #3749b5;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <img src="https://imgur.com/a/H13grEE" alt="학교 로고">
    <h1>도비중학교</h1>
</header>

<nav>
    <a href="#">학교소개</a>
    <a href="#">공지사항</a>
    <a href="#">학생활동</a>
    <a href="#">자료실</a>
    <a href="#">문의</a>
</nav>

<div class="container">
    <div class="card">
        <h2>공지사항</h2>
        <p>여기에 학교 공지사항이 표시됩니다.</p>
    </div>

    <div class="card">
        <h2>학교 소개</h2>
        <p>도비중학교에 오신 것을 환영합니다.</p>
    </div>

    <div class="card">
        <h2>학생 활동</h2>
        <p>다양한 학생 활동 정보를 확인하세요.</p>
    </div>
</div>

<footer>
    <p>© 2026 도비중학교. All rights reserved.</p>
</footer>

</html>
